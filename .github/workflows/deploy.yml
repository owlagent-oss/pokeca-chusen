# main に push したら site/ を Cloudflare Pages（pokeca-chusen-navi）に自動で公開する
# 必要な GitHub Secrets：CLOUDFLARE_API_TOKEN（Pages の編集権限）・CLOUDFLARE_ACCOUNT_ID
name: deploy
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare Pages に公開
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=pokeca-chusen-navi --branch=main --commit-dirty=true
